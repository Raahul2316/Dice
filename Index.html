<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Dice Roller</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
    }

    /* Scene Container with 3D Perspective */
    .scene {
      width: 200px;
      height: 200px;
      perspective: 1000px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Ambient Shadow beneath the Die */
    .floor-shadow {
      position: absolute;
      width: 160px;
      height: 160px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 50%;
      transform: rotateX(90deg) translateZ(-130px);
      filter: blur(15px);
      transition: transform 0.4s ease, opacity 0.4s ease;
      pointer-events: none;
    }

    .scene.rolling .floor-shadow {
      transform: rotateX(90deg) translateZ(-160px) scale(0.8);
      opacity: 0.2;
    }

    /* The 3D Cube (Die) */
    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1.2s cubic-bezier(0.2, 0.85, 0.25, 1);
    }

    /* Each Face of the Cube */
    .cube-face {
      position: absolute;
      width: 200px;
      height: 200px;
      background: linear-gradient(145deg, #ffffff, #e6e6e6);
      border-radius: 28px;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.1),
                  0 0 20px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.8);
      display: grid;
      grid-template: repeat(3, 1fr) / repeat(3, 1fr);
      padding: 22px;
      box-sizing: border-box;
    }

    /* Standard 3D Transforms for 6 Sides (100px = half of 200px width) */
    .face-1 { transform: rotateY(0deg) translateZ(100px); }
    .face-6 { transform: rotateY(180deg) translateZ(100px); }
    .face-2 { transform: rotateY(-90deg) translateZ(100px); }
    .face-5 { transform: rotateY(90deg) translateZ(100px); }
    .face-3 { transform: rotateX(-90deg) translateZ(100px); }
    .face-4 { transform: rotateX(90deg) translateZ(100px); }

    /* Pip (Dot) Styling */
    .pip {
      display: block;
      align-self: center;
      justify-self: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #334155, #0f172a);
      box-shadow: inset 1px 1px 3px rgba(0, 0, 0, 0.6),
                  0 1px 2px rgba(255, 255, 255, 0.8);
    }

    /* Accent dot for Side 1 */
    .face-1 .pip {
      background: radial-gradient(circle at 35% 35%, #ef4444, #991b1b);
      width: 40px;
      height: 40px;
    }

    /* Grid positions for standard dice pip layouts */
    .pip:nth-child(2) { grid-area: 1 / 3; }
    .pip:nth-child(3) { grid-area: 3 / 1; }
    .pip:nth-child(4) { grid-area: 3 / 3; }
    .pip:nth-child(5) { grid-area: 2 / 2; }
    .pip:nth-child(6) { grid-area: 2 / 1; }
    .pip:nth-child(7) { grid-area: 2 / 3; }

    /* Minimal Prompt Text */
    .prompt {
      position: absolute;
      bottom: 12%;
      font-size: 1rem;
      letter-spacing: 0.25em;
      text-transform: lowercase;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 300;
      pointer-events: none;
      transition: opacity 0.3s ease;
      animation: pulse 2.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: translateY(0); }
      50% { opacity: 0.6; transform: translateY(-3px); }
    }
  </style>
</head>
<body>

  <!-- Main 3D Container -->
  <div class="scene" id="scene">
    <div class="floor-shadow"></div>
    <div class="cube" id="cube">
      
      <!-- Side 1 -->
      <div class="cube-face face-1">
        <span class="pip" style="grid-area: 2 / 2;"></span>
      </div>

      <!-- Side 2 -->
      <div class="cube-face face-2">
        <span class="pip" style="grid-area: 1 / 1;"></span>
        <span class="pip" style="grid-area: 3 / 3;"></span>
      </div>

      <!-- Side 3 -->
      <div class="cube-face face-3">
        <span class="pip" style="grid-area: 1 / 1;"></span>
        <span class="pip" style="grid-area: 2 / 2;"></span>
        <span class="pip" style="grid-area: 3 / 3;"></span>
      </div>

      <!-- Side 4 -->
      <div class="cube-face face-4">
        <span class="pip" style="grid-area: 1 / 1;"></span>
        <span class="pip" style="grid-area: 1 / 3;"></span>
        <span class="pip" style="grid-area: 3 / 1;"></span>
        <span class="pip" style="grid-area: 3 / 3;"></span>
      </div>

      <!-- Side 5 -->
      <div class="cube-face face-5">
        <span class="pip" style="grid-area: 1 / 1;"></span>
        <span class="pip" style="grid-area: 1 / 3;"></span>
        <span class="pip" style="grid-area: 2 / 2;"></span>
        <span class="pip" style="grid-area: 3 / 1;"></span>
        <span class="pip" style="grid-area: 3 / 3;"></span>
      </div>

      <!-- Side 6 -->
      <div class="cube-face face-6">
        <span class="pip" style="grid-area: 1 / 1;"></span>
        <span class="pip" style="grid-area: 1 / 3;"></span>
        <span class="pip" style="grid-area: 2 / 1;"></span>
        <span class="pip" style="grid-area: 2 / 3;"></span>
        <span class="pip" style="grid-area: 3 / 1;"></span>
        <span class="pip" style="grid-area: 3 / 3;"></span>
      </div>

    </div>
  </div>

  <!-- Prompt -->
  <div class="prompt">tap to roll</div>

  <script>
    const cube = document.getElementById('cube');
    const scene = document.getElementById('scene');
    let isRolling = false;

    // Track full rotations to keep spinning natural and continuously advancing forward
    let currentRotationX = -25;
    let currentRotationY = 45;

    // Base rotation maps for landing each side cleanly upright facing front
    const sideRotations = {
      1: { x: 0,    y: 0 },
      2: { x: 0,    y: 90 },
      3: { x: 90,   y: 0 },
      4: { x: -90,  y: 0 },
      5: { x: 0,    y: -90 },
      6: { x: 0,    y: 180 }
    };

    function rollDice() {
      if (isRolling) return;
      isRolling = true;

      // Haptic feedback for supported mobile devices
      if (navigator.vibrate) {
        navigator.vibrate(30);
      }

      scene.classList.add('rolling');

      // Pick random result between 1 and 6
      const nextSide = Math.floor(Math.random() * 6) + 1;
      const target = sideRotations[nextSide];

      // Add 2 to 4 full 360-degree spins for realistic physics feel
      const extraSpinsX = (Math.floor(Math.random() * 3) + 2) * 360;
      const extraSpinsY = (Math.floor(Math.random() * 3) + 2) * 360;

      // Calculate next rotation values continuing smoothly from current state
      currentRotationX = currentRotationX + extraSpinsX + (target.x - (currentRotationX % 360));
      currentRotationY = currentRotationY + extraSpinsY + (target.y - (currentRotationY % 360));

      // Apply transformation matrix
      cube.style.transform = `rotateX(${currentRotationX}deg) rotateY(${currentRotationY}deg)`;

      // Reset bounce state after animation finishes
      setTimeout(() => {
        scene.classList.remove('rolling');
        isRolling = false;
        if (navigator.vibrate) {
          navigator.vibrate([15, 30, 15]);
        }
      }, 1200);
    }

    // Set initial modern perspective angle
    cube.style.transform = `rotateX(${currentRotationX}deg) rotateY(${currentRotationY}deg)`;

    // Touch & Click Event Listeners on whole window/screen for frictionless mobile interaction
    window.addEventListener('click', rollDice);
    window.addEventListener('touchstart', (e) => {
      // Prevent double triggers on mobile browsers
      e.preventDefault();
      rollDice();
    }, { passive: false });
  </script>
</body>
</html>
